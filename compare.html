<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLB Analytics 2026 — Compare</title>
<style>
:root{--mlb:#003087;--good:#16803b;--bad:#c43d3d;--neutral:#667085;--gold:#d97706}*{box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f7f9;margin:0;padding:10px;color:#333}.dashboard{max-width:1400px;margin:auto}.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;padding:0 5px}.brand{margin:0;font-size:1.5rem;color:var(--mlb)}.stamp{font-size:13px;color:#666;font-weight:600;background:#eee;padding:4px 10px;border-radius:4px}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav a{padding:9px 14px;border-radius:7px;text-decoration:none;color:var(--mlb);background:#fff;border:1px solid #dfe3e8;font-size:13px;font-weight:700}.nav a.active,.nav a:hover{color:#fff;background:var(--mlb);border-color:var(--mlb)}.panel,.category-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 15px #0000000d;margin-bottom:20px}.controls{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr) minmax(340px,1.4fr);gap:18px;align-items:end}.group{display:flex;flex-direction:column;gap:8px}label{font-size:11px;font-weight:700;text-transform:uppercase;color:#777;letter-spacing:.5px}select,.btn{padding:10px 14px;border:1px solid #dfe3e8;border-radius:6px;background:#fff;font-size:13px}.btn{cursor:pointer}.btn:hover{background:#f4f6f8}.btn.active{background:var(--mlb);color:#fff;border-color:var(--mlb)}.sorts{display:flex;flex-wrap:wrap;gap:6px}.note{margin:15px 0 0;color:#667085;font-size:12px}.category-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}.category-head h2{margin:0;color:var(--mlb);font-size:1.2rem}.category-head span{font-size:12px;color:#667085}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th{font-size:11px;text-transform:uppercase;letter-spacing:.45px;color:#667085;text-align:left;padding:8px 10px;border-bottom:2px solid #e7ebef}td{padding:11px 10px;border-bottom:1px solid #edf0f2;vertical-align:middle}tbody tr:last-child td{border-bottom:0}.stat{font-weight:650;width:25%}.value-cell{position:relative;border-radius:7px}.value-cell.winner{background:#e9f7ee;box-shadow:inset 4px 0 var(--good)}.value{font-weight:750;font-variant-numeric:tabular-nums}.sub{display:block;margin-top:3px;font-size:11px;color:#667085}.sub.good{color:var(--good)}.sub.bad{color:var(--bad)}.avg-cell{font-variant-numeric:tabular-nums;color:#475467}.direction{font-size:10px;color:#98a2b3;display:block;margin-top:2px}.bar{height:5px;background:#edf0f2;border-radius:4px;margin-top:7px;position:relative;overflow:hidden}.bar:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:#98a2b3}.fill{position:absolute;height:100%;top:0;border-radius:4px}.fill.good{background:var(--good)}.fill.bad{background:var(--bad)}.result{font-size:12px;font-weight:700}.result.good{color:var(--good)}.result.bad{color:var(--bad)}.loading,.error{background:#fff;padding:28px;border-radius:12px;text-align:center;color:#667085}.error{color:var(--bad)}@media(max-width:850px){.controls{grid-template-columns:1fr}.sorts{margin-top:0}table{min-width:720px}.brand{width:100%}}
</style></head><body><main class="dashboard">
<header class="top"><h1 class="brand">MLB Analytics 2026</h1><nav class="nav" aria-label="Dashboard pages"><a href="index.html">Standings</a><a href="trends.html">Trends</a><a href="games.html">Games</a><a class="active" href="compare.html">Compare</a></nav><div id="updated" class="stamp">Connecting…</div></header>
<section class="panel"><div class="controls"><div class="group"><label for="team1">Team 1</label><select id="team1" onchange="selectionChanged()"></select></div><div class="group"><label for="team2">Team 2 (optional)</label><select id="team2" onchange="selectionChanged()"><option value="">Compare with MLB average</option></select></div><div class="group"><label>Sort statistics within each category</label><div class="sorts"><button id="sort-name" class="btn active" onclick="setSort('name')">Name</button><button id="sort-favorable" class="btn" onclick="setSort('favorable')">Most Favorable</button><button id="sort-unfavorable" class="btn" onclick="setSort('unfavorable')">Most Unfavorable</button><button id="sort-rank" class="btn" onclick="setSort('rank')">MLB Rank</button></div></div></div><p id="mode-note" class="note"></p></section>
<div id="content"><div class="loading">Loading comparison data…</div></div></main>
<script>
const stats={
 pitching:[{label:'Avg. Against',key:'avg',dir:'asc'},{label:'ERA',key:'era',dir:'asc'},{label:'Hits Allowed',key:'hits',dir:'asc'},{label:'HR Allowed',key:'homeRuns',dir:'asc'},{label:'K to Walk Ratio',key:'strikeoutWalkRatio',dir:'desc'},{label:'Ks per 9',key:'strikeoutsPer9Inn',dir:'desc'},{label:'Pitches Per Inning',key:'pitchesPerInning',dir:'asc'},{label:'Runs Allowed',key:'runs',dir:'asc'},{label:'Strike %',key:'strikePercentage',dir:'desc'},{label:'Walks per 9',key:'walksPer9Inn',dir:'asc'},{label:'WHIP',key:'whip',dir:'asc'}],
 hitting:[{label:'2B',key:'doubles',dir:'desc'},{label:'3B',key:'triples',dir:'desc'},{label:'AB Per HR',key:'atBatsPerHomeRun',dir:'asc'},{label:'AVG',key:'avg',dir:'desc'},{label:'Avg. Balls in Play',key:'babip',dir:'desc'},{label:'BB',key:'baseOnBalls',dir:'desc'},{label:'Fly Outs',key:'airOuts',dir:'asc'},{label:'GIDP',key:'groundIntoDoublePlay',dir:'asc'},{label:'Ground Outs',key:'groundOuts',dir:'asc'},{label:'H',key:'hits',dir:'desc'},{label:'HRs',key:'homeRuns',dir:'desc'},{label:'Ks',key:'strikeOuts',dir:'asc'},{label:'OBP',key:'obp',dir:'desc'},{label:'OPS',key:'ops',dir:'desc'},{label:'RBI',key:'rbi',dir:'desc'},{label:'Runs Scored',key:'runs',dir:'desc'},{label:'SB',key:'stolenBases',dir:'desc'},{label:'SB %',key:'stolenBasePercentage',dir:'desc'},{label:'SLG',key:'slg',dir:'desc'}],
 fielding:[{label:'Assists',key:'assists',dir:'desc'},{label:'Double Plays',key:'doublePlays',dir:'desc'},{label:'Errors',key:'errors',dir:'asc'},{label:'Fielding %',key:'fielding',dir:'desc'},{label:'Put Outs',key:'putOuts',dir:'desc'},{label:'Range Factor/9 Inn',key:'rangeFactorPer9Inn',dir:'desc'},{label:'Range Factor/Game',key:'rangeFactorPerGame',dir:'desc'},{label:'Triple Plays',key:'triplePlays',dir:'desc'}]
};
const categoryNames={pitching:'Pitching',hitting:'Hitting',fielding:'Fielding'},rateKeys=new Set(['avg','babip','obp','ops','slg','fielding','strikePercentage','stolenBasePercentage','winPercentage']);let colors={},latest={},sortMode='name';
async function json(path){const r=await fetch(path);if(!r.ok)throw new Error(`${path}: ${r.status}`);return r.json()}
function latestTeams(rows){const map=new Map;for(const row of rows){const id=String(row.teamId),old=map.get(id);if(!old||String(row.date)>String(old.date))map.set(id,row)}return map}
async function init(){try{const [log,c,p,h,f]=await Promise.all([json('./data/update_log.json').catch(()=>null),json('./data/team_colors.json'),json('./data/pitching_s2d.json'),json('./data/hitting_s2d.json'),json('./data/fielding_s2d.json')]);colors=c;latest={pitching:latestTeams(p),hitting:latestTeams(h),fielding:latestTeams(f)};document.querySelector('#updated').textContent=log?`Last Sync: ${log.last_updated}`:'Live Sync Active';buildSelectors();render()}catch(e){console.error(e);document.querySelector('#updated').textContent='Data unavailable';document.querySelector('#content').innerHTML=`<div class="error">Could not load comparison data. Confirm the three <code>*_s2d.json</code> files and <code>team_colors.json</code> are in the data folder.</div>`}}
function buildSelectors(){const teams=Object.entries(colors).sort((a,b)=>a[1].name.localeCompare(b[1].name)),one=document.querySelector('#team1'),two=document.querySelector('#team2');for(const [id,t] of teams){one.add(new Option(t.name,id));two.add(new Option(t.name,id))}one.value=teams[0]?.[0]||'';updateDisabled()}
function selectionChanged(){const one=document.querySelector('#team1'),two=document.querySelector('#team2');if(one.value===two.value)two.value='';updateDisabled();render()}
function updateDisabled(){const a=document.querySelector('#team1').value,b=document.querySelector('#team2').value,rank=document.querySelector('#sort-rank');for(const o of document.querySelector('#team1').options)o.disabled=o.value===b;for(const o of document.querySelector('#team2').options)o.disabled=o.value!==''&&o.value===a;rank.disabled=!!b;rank.style.opacity=b?'.4':'1';rank.style.cursor=b?'not-allowed':'pointer';if(b&&sortMode==='rank'){sortMode='name';document.querySelectorAll('.sorts .btn').forEach(x=>x.classList.remove('active'));document.querySelector('#sort-name').classList.add('active')}}
function setSort(mode){const button=document.querySelector(`#sort-${mode}`);if(button.disabled)return;sortMode=mode;document.querySelectorAll('.sorts .btn').forEach(b=>b.classList.remove('active'));button.classList.add('active');render()}
function number(v){const n=Number(v);return Number.isFinite(n)?n:null}function avg(values){const good=values.filter(Number.isFinite);return good.length?good.reduce((a,b)=>a+b,0)/good.length:null}
function format(v,key,isAverage=false){if(v===null)return '—';if(rateKeys.has(key))return v.toFixed(3).replace(/^0(?=\.)/,'');if(isAverage)return Math.abs(v)>=100?v.toFixed(1):v.toFixed(2);if(Number.isInteger(v))return v.toLocaleString();return v.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')}
function score(value,league,dir){if(value===null||league===null)return null;const delta=league?((value-league)/Math.abs(league))*100:value-league;return(dir==='desc'?1:-1)*delta}
function relativeText(value,league,dir){const s=score(value,league,dir);if(s===null)return{html:'No data',cls:''};if(Math.abs(s)<.05)return{html:'At MLB average',cls:''};if(league===0)return{html:`${s>0?'Better':'Worse'} than MLB (avg. 0)`,cls:s>0?'good':'bad'};return{html:`${Math.abs(s).toFixed(1)}% ${s>0?'better':'worse'} than MLB`,cls:s>0?'good':'bad'}}
function bar(value,league,dir){const s=score(value,league,dir);if(s===null||Math.abs(s)<.05)return'';const w=Math.min(50,Math.max(2,Math.abs(s)/2)),left=s>0?50:50-w;return`<div class="bar"><span class="fill ${s>0?'good':'bad'}" style="left:${left}%;width:${w}%"></span></div>`}
function rowsFor(category,id1,id2){const all=[...latest[category].values()],a=latest[category].get(id1),b=id2?latest[category].get(id2):null;return stats[category].map(s=>{const values=all.map(d=>number(d[s.key])).filter(Number.isFinite),league=avg(values),v1=a?number(a[s.key]):null,v2=b?number(b[s.key]):null,sortScore=id2?score(v1,v2,s.dir):score(v1,league,s.dir),rank=v1===null?null:1+values.filter(v=>s.dir==='desc'?v>v1:v<v1).length;return{...s,league,v1,v2,sortScore,rank,rankTotal:values.length}}).sort((a,b)=>sortMode==='name'?a.label.localeCompare(b.label):sortMode==='rank'?(a.rank??Infinity)-(b.rank??Infinity):sortMode==='favorable'?(b.sortScore??-Infinity)-(a.sortScore??-Infinity):(a.sortScore??Infinity)-(b.sortScore??Infinity))}
function valueCell(v,league,s,winner){const r=relativeText(v,league,s.dir);return`<td class="value-cell ${winner?'winner':''}"><span class="value">${format(v,s.key)}</span><span class="sub ${r.cls}">${r.html}</span>${bar(v,league,s.dir)}</td>`}
function winner(v1,v2,dir){if(v1===null||v2===null||Math.abs(v1-v2)<1e-12)return 0;return dir==='desc'?(v1>v2?1:2):(v1<v2?1:2)}
function render(){if(!Object.keys(colors).length)return;const id1=document.querySelector('#team1').value,id2=document.querySelector('#team2').value,n1=colors[id1]?.name||'Team 1',n2=id2?colors[id2]?.name:null,c1=colors[id1]?.primary||'#003087',c2=id2?(colors[id2]?.primary||'#003087'):null;document.querySelector('#mode-note').textContent=id2?`Comparing ${n1} and ${n2}. Green highlights the more favorable value; MLB averages remain as context.`:`Comparing ${n1} with the MLB average. Rank 1 is the most favorable value among teams with available data.`;document.querySelector('#content').innerHTML=['pitching','hitting','fielding'].map(category=>{const rows=rowsFor(category,id1,id2),date=latest[category].get(id1)?.date||'';return`<section class="category-card"><div class="category-head"><h2>${categoryNames[category]}</h2><span>Latest team data${date?`: ${date}`:''}</span></div><div class="table-wrap"><table><thead><tr><th class="stat">Statistic</th><th style="color:${c1}">${n1}</th><th>MLB Avg.</th>${id2?`<th style="color:${c2}">${n2}</th><th>Result</th>`:'<th>MLB Rank</th>'}</tr></thead><tbody>${rows.map(s=>{const win=id2?winner(s.v1,s.v2,s.dir):0,result=win?`${win===1?n1:n2} leads`:'Even',resultColor=win===1?c1:win===2?c2:'#667085';return`<tr><td class="stat">${s.label}<span class="direction">${s.dir==='desc'?'Higher is better':'Lower is better'}</span></td>${valueCell(s.v1,s.league,s,win===1)}<td class="avg-cell"><span class="value">${format(s.league,s.key,true)}</span></td>${id2?`${valueCell(s.v2,s.league,s,win===2)}<td><span class="result" style="color:${resultColor}">${result}</span></td>`:`<td class="avg-cell"><span class="value">${s.rank===null?'—':`#${s.rank}`}</span><span class="sub">${s.rank===null?'':`of ${s.rankTotal} teams`}</span></td>`}</tr>`}).join('')}</tbody></table></div></section>`}).join('')}
init();
</script></body></html>
