<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLB Analytics 2026 — Games</title><script src="https://d3js.org/d3.v7.min.js"></script><style>
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f7f9;margin:0;padding:10px;color:#333}.dashboard{max-width:1400px;margin:auto}.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;padding:0 5px}.brand{margin:0;font-size:1.5rem;color:#003087}.stamp{font-size:13px;color:#666;font-weight:600;background:#eee;padding:4px 10px;border-radius:4px}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav a{padding:9px 14px;border-radius:7px;text-decoration:none;color:#003087;background:#fff;border:1px solid #dfe3e8;font-size:13px;font-weight:700}.nav a.active,.nav a:hover{color:#fff;background:#003087;border-color:#003087}.panel,.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 15px #0000000d;margin-bottom:20px}.row{display:flex;flex-wrap:wrap;gap:15px;align-items:flex-start}.group{display:flex;flex-direction:column;gap:8px;flex:1 1 200px}label{font-size:11px;font-weight:700;text-transform:uppercase;color:#777;letter-spacing:.5px}select,.btn{padding:10px 14px;border:1px solid #dfe3e8;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}.btn.active{background:#003087;color:#fff;border-color:#003087}.pills,#geo{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto;padding:12px;border:1px solid #dfe3e8;border-radius:8px;background:#fafbfc}.pill{padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid #ddd;background:#fff;white-space:nowrap}.pill.active{background:#003087;color:#fff;border-color:#003087}svg{width:100%;height:auto;display:block;overflow:visible}.box{opacity:.18;cursor:help}.box:hover{opacity:.32}.line{stroke-width:2}.median{stroke-width:3}.mean{stroke-width:3;stroke-dasharray:5,3;opacity:.75}.mlb{stroke:#000;stroke-width:2;stroke-dasharray:4,4;opacity:.8}.tooltip{position:absolute;padding:12px;background:#fffffffA;border-left:5px solid #003087;border-radius:4px;pointer-events:none;display:none;box-shadow:0 10px 30px #0003;font-size:13px;z-index:10;min-width:180px}h2{font-size:1.1rem;margin:0}@media(max-width:768px){#geo{flex-wrap:nowrap}.btn{white-space:nowrap}}</style></head><body><main class="dashboard">
<header class="top"><h1 class="brand">MLB Analytics 2026</h1><nav class="nav"><a href="index.html">Standings</a><a href="trends.html">Trends</a><a class="active" href="games.html">Games</a></nav><div id="updated" class="stamp">Connecting…</div></header>
<section class="panel"><div class="row"><div class="group"><label>Category</label><select id="category" onchange="changeCategory()"><option value="pitching">Pitching</option><option value="hitting">Hitting</option><option value="fielding">Fielding</option></select></div><div class="group"><label>Statistic</label><select id="stat" onchange="render()"></select></div><div class="group"><label>Team Order</label><div><button id="name" class="btn active" onclick="setSort('name')">Sort by Name</button> <button id="mean" class="btn" onclick="setSort('mean')">Sort by Mean</button></div></div></div><div class="group" style="margin-top:18px"><label>Quick Filters</label><div id="geo"></div></div><div class="group" style="margin-top:18px"><label>Team Selection</label><div id="teams" class="pills"></div><div><button class="btn" onclick="chooseNone()">Clear All</button> <button class="btn" onclick="chooseAll()">Select All</button></div></div></section>
<section class="card"><h2 id="title">Variance by Game</h2><div id="chart"></div></section></main><div id="tip" class="tooltip"></div><script>
const cfg={fielding:[['Assists','assists','desc'],['Double Plays','doublePlays','desc'],['Errors','errors','asc'],['Fielding %','fielding','desc'],['Put Outs','putOuts','desc'],['Range Factor/9 Inn','rangeFactorPer9Inn','desc'],['Range Factor/Game','rangeFactorPerGame','desc'],['Triple Plays','triplePlays','desc']],hitting:[['2B','doubles','desc'],['3B','triples','desc'],['AB Per HR','atBatsPerHomeRun','asc'],['AVG','avg','desc'],['Avg. Balls in Play','babip','desc'],['BB','baseOnBalls','desc'],['Fly Outs','airOuts','asc'],['GIDP','groundIntoDoublePlay','asc'],['Ground Outs','groundOuts','asc'],['H','hits','desc'],['HRs','homeRuns','desc'],['Ks','strikeOuts','asc'],['OBP','obp','desc'],['OPS','ops','desc'],['RBI','rbi','desc'],['Runs Scored','runs','desc'],['SB','stolenBases','desc'],['SB %','stolenBasePercentage','desc'],['SLG','slg','desc']],pitching:[['Avg. Against','avg','asc'],['ERA','era','asc'],['Hits Allowed','hits','asc'],['HR Allowed','homeRuns','asc'],['K to Walk Ratio','strikeoutWalkRatio','desc'],['Ks per 9','strikeoutsPer9Inn','desc'],['Pitches Per Inning','pitchesPerInning','asc'],['Runs Allowed','runs','asc'],['Strike %','strikePercentage','desc'],['Walks per 9','walksPer9Inn','asc'],['WHIP','whip','asc'],['Win %','winPercentage','desc']]};const M={top:60,right:180,bottom:60,left:220},W=1350-M.left-M.right;let colors,data,active=new Set,category='pitching',sort='name',svg,x,y;
async function init(){try{const l=await d3.json('./data/update_log.json');d3.select('#updated').text(`Last Sync: ${l.last_updated}`)}catch{d3.select('#updated').text('Live Sync Active')}colors=await d3.json('./data/team_colors.json');Object.keys(colors).forEach(id=>active.add(id));filters();svg=d3.select('#chart').append('svg').append('g').attr('transform',`translate(${M.left},${M.top})`);x=d3.scaleLinear().range([0,W]);y=d3.scaleBand().paddingInner(1);svg.append('g').attr('class','xa');changeCategory()}
function filters(){const gs=[['ALL','All MLB'],['AL','AL'],['NL','NL'],['AL-East','AL-East'],['AL-Central','AL-Central'],['AL-West','AL-West'],['NL-East','NL-East'],['NL-Central','NL-Central'],['NL-West','NL-West']];d3.select('#geo').selectAll('button').data(gs).join('button').attr('class',(d,i)=>`btn${i?'':' active'}`).text(d=>d[1]).on('click',function(e,d){applyGeo(d[0],this)});d3.select('#teams').selectAll('button').data(Object.entries(colors).sort((a,b)=>a[1].name.localeCompare(b[1].name))).join('button').attr('class','pill active').attr('data-id',d=>d[0]).text(d=>d[1].name).on('click',function(e,d){active.has(d[0])?active.delete(d[0]):active.add(d[0]);d3.select(this).classed('active',active.has(d[0]));render()})}
async function changeCategory(){category=d3.select('#category').property('value');const stats=[...cfg[category]].sort((a,b)=>a[0].localeCompare(b[0]));d3.select('#stat').selectAll('option').data(stats).join('option').attr('value',d=>d[1]).text(d=>d[0]);data=await d3.json(`./data/${category}.json`);render()}function chooseNone(){active.clear();d3.selectAll('.pill').classed('active',false);render()}function chooseAll(){Object.keys(colors).forEach(id=>active.add(id));d3.selectAll('.pill').classed('active',true);render()}function applyGeo(g,b){active.clear();d3.selectAll('#geo .btn').classed('active',false);d3.select(b).classed('active',true);Object.entries(colors).forEach(([id,c])=>{if(g==='ALL'||c.league===g||`${c.league}-${c.division}`===g)active.add(id)});d3.selectAll('.pill').classed('active',function(){return active.has(this.dataset.id)});render()}function setSort(v){sort=v;d3.selectAll('#name,#mean').classed('active',false);d3.select(`#${v}`).classed('active',true);render()}
function render(){if(!data)return;const stat=d3.select('#stat').property('value'),info=cfg[category].find(d=>d[1]===stat),rows=data.filter(d=>active.has(String(d.teamId))),groups=d3.groups(rows,d=>String(d.teamId));sort==='mean'?groups.sort((a,b)=>info[2]==='desc'?d3.descending(d3.mean(a[1],d=>+d[stat]||0),d3.mean(b[1],d=>+d[stat]||0)):d3.ascending(d3.mean(a[1],d=>+d[stat]||0),d3.mean(b[1],d=>+d[stat]||0))):groups.sort((a,b)=>d3.ascending(colors[a[0]]?.name,colors[b[0]]?.name));d3.select('#title').text(groups.length?`Variance by Game: ${info[0]} — ${category[0].toUpperCase()+category.slice(1)}`:'Variance by Game — no teams selected');const height=Math.max(groups.length*60+100,400);d3.select('#chart svg').attr('viewBox',`0 0 ${W+M.left+M.right} ${height}`);svg.selectAll('.row,.mlbg').remove();if(!groups.length)return;x.domain(d3.extent(data,d=>+d[stat]||0)).nice();y.domain(groups.map(d=>d[0])).range([0,height-100]);const mlb=d3.mean(data,d=>+d[stat]||0),mg=svg.append('g').attr('class','mlbg');mg.append('line').attr('class','mlb').attr('x1',x(mlb)).attr('x2',x(mlb)).attr('y1',-20).attr('y2',height-100);mg.append('text').attr('x',x(mlb)).attr('y',-30).attr('text-anchor','middle').style('font-size','10px').style('font-weight','700').text(`MLB AVG: ${mlb.toFixed(3)}`);const g=svg.selectAll('.row').data(groups).join('g').attr('class','row').attr('transform',d=>`translate(0,${y(d[0])})`);g.append('text').attr('x',-15).attr('y',5).attr('text-anchor','end').style('font-size','12px').style('font-weight','600').text(d=>colors[d[0]]?.name);g.each(function(d){const vals=d[1].map(v=>+v[stat]||0).filter(Number.isFinite).sort(d3.ascending);if(!vals.length)return;const min=d3.min(vals),q1=d3.quantile(vals,.25),med=d3.median(vals),q3=d3.quantile(vals,.75),max=d3.max(vals),avg=d3.mean(vals),c=colors[d[0]]?.primary||'#333',z={team:colors[d[0]]?.name,min,q1,med,q3,max,avg};const r=d3.select(this);r.append('line').attr('class','line').attr('stroke',c).attr('x1',x(min)).attr('x2',x(max));r.append('line').attr('class','line').attr('stroke',c).attr('x1',x(min)).attr('x2',x(min)).attr('y1',-14).attr('y2',14);r.append('line').attr('class','line').attr('stroke',c).attr('x1',x(max)).attr('x2',x(max)).attr('y1',-14).attr('y2',14);r.append('rect').attr('class','box').attr('fill',c).attr('stroke',c).attr('x',x(q1)).attr('y',-14).attr('width',Math.max(1,x(q3)-x(q1))).attr('height',28).on('mousemove',e=>tip(e,z)).on('mouseleave',()=>d3.select('#tip').style('display','none'));r.append('line').attr('class','median').attr('stroke',c).attr('x1',x(med)).attr('x2',x(med)).attr('y1',-14).attr('y2',14);r.append('line').attr('class','mean').attr('stroke',c).attr('x1',x(avg)).attr('x2',x(avg)).attr('y1',-18).attr('y2',18)});svg.select('.xa').attr('transform',`translate(0,${height-90})`).call(d3.axisBottom(x))}function tip(e,z){d3.select('#tip').style('display','block').style('left',`${e.pageX+20}px`).style('top',`${e.pageY-20}px`).html(`<b>${z.team}</b><hr><b>Box Plot</b><br>Min: ${z.min.toFixed(3)}<br>Q1: ${z.q1.toFixed(3)}<br>Median: <b>${z.med.toFixed(3)}</b><br>Q3: ${z.q3.toFixed(3)}<br>Max: ${z.max.toFixed(3)}<br>Mean: <b>${z.avg.toFixed(3)}</b>`)}init();
</script></body></html>
