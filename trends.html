<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLB Analytics 2026 — Trends</title><script src="https://d3js.org/d3.v7.min.js"></script><style>
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f7f9;margin:0;padding:10px;color:#333}.dashboard{max-width:1400px;margin:auto}.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;padding:0 5px}.brand{margin:0;font-size:1.5rem;color:#003087}.stamp{font-size:13px;color:#666;font-weight:600;background:#eee;padding:4px 10px;border-radius:4px}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav a{padding:9px 14px;border-radius:7px;text-decoration:none;color:#003087;background:#fff;border:1px solid #dfe3e8;font-size:13px;font-weight:700}.nav a.active,.nav a:hover{color:#fff;background:#003087;border-color:#003087}.panel,.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 15px #0000000d;margin-bottom:20px}.row{display:flex;flex-wrap:wrap;gap:15px;align-items:flex-start}.group{display:flex;flex-direction:column;gap:8px;flex:1 1 200px}label{font-size:11px;font-weight:700;text-transform:uppercase;color:#777;letter-spacing:.5px}select,.btn{padding:10px 14px;border:1px solid #dfe3e8;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}.btn.active{background:#003087;color:#fff;border-color:#003087}.pills,#geo{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto;padding:12px;border:1px solid #dfe3e8;border-radius:8px;background:#fafbfc}.pill{padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid #ddd;background:#fff;white-space:nowrap}.pill.active{background:#003087;color:#fff;border-color:#003087}svg{width:100%;height:auto;display:block;overflow:visible}.line{fill:none;stroke-width:2.5;opacity:.3;cursor:crosshair}.line.hovered{opacity:1!important;stroke-width:5!important}.avg,.selection{fill:none;stroke-width:2.5;opacity:.85;pointer-events:none}.avg{stroke:#000;stroke-dasharray:5,5}.selection{stroke:#d97706;stroke-dasharray:9,4}.avg-label{font-size:11px;font-weight:700}.label{font-size:11px;font-weight:700;fill:#444}.tooltip{position:absolute;padding:12px;background:#fffffffA;border-left:5px solid #003087;border-radius:4px;pointer-events:none;display:none;box-shadow:0 10px 30px #0003;font-size:13px;z-index:10;min-width:180px}h2{font-size:1.1rem;margin:0}@media(max-width:768px){#geo{flex-wrap:nowrap}.btn{white-space:nowrap}}</style></head><body><main class="dashboard">
<header class="top"><h1 class="brand">MLB Analytics 2026</h1><nav class="nav"><a href="index.html">Standings</a><a class="active" href="trends.html">Trends</a><a href="games.html">Games</a><a href="compare.html">Compare</a></nav><div id="updated" class="stamp">Connecting…</div></header>
<section class="panel"><div class="row"><div class="group"><label>Category</label><select id="category" onchange="changeCategory()"><option value="pitching">Pitching</option><option value="hitting">Hitting</option><option value="fielding">Fielding</option></select></div><div class="group"><label>Statistic</label><select id="stat" onchange="render()"></select></div><div class="group"><label>View Mode</label><div><button id="line" class="btn active" onclick="setView('line')">Lines</button> <button id="race" class="btn" onclick="setView('race')">Horse Race</button></div></div></div><div class="group" style="margin-top:18px"><label>Quick Filters</label><div id="geo"></div></div><div class="group" style="margin-top:18px"><label>Team Selection</label><div id="teams" class="pills"></div><div><button class="btn" onclick="chooseNone()">Clear All</button> <button class="btn" onclick="chooseAll()">Select All</button></div></div></section>
<section class="card"><h2 id="title">Season Performance Trends</h2><div id="chart"></div></section></main><div id="tip" class="tooltip"></div><script>
const cfg={fielding:[['Assists','assists','desc'],['Double Plays','doublePlays','desc'],['Errors','errors','asc'],['Fielding %','fielding','desc'],['Put Outs','putOuts','desc'],['Range Factor/9 Inn','rangeFactorPer9Inn','desc'],['Range Factor/Game','rangeFactorPerGame','desc'],['Triple Plays','triplePlays','desc']],hitting:[['2B','doubles','desc'],['3B','triples','desc'],['AB Per HR','atBatsPerHomeRun','asc'],['AVG','avg','desc'],['Avg. Balls in Play','babip','desc'],['BB','baseOnBalls','desc'],['Fly Outs','airOuts','asc'],['GIDP','groundIntoDoublePlay','asc'],['Ground Outs','groundOuts','asc'],['H','hits','desc'],['HRs','homeRuns','desc'],['Ks','strikeOuts','asc'],['OBP','obp','desc'],['OPS','ops','desc'],['RBI','rbi','desc'],['Runs Scored','runs','desc'],['SB','stolenBases','desc'],['SB %','stolenBasePercentage','desc'],['SLG','slg','desc']],pitching:[['Avg. Against','avg','asc'],['ERA','era','asc'],['Hits Allowed','hits','asc'],['HR Allowed','homeRuns','asc'],['K to Walk Ratio','strikeoutWalkRatio','desc'],['Ks per 9','strikeoutsPer9Inn','desc'],['Pitches Per Inning','pitchesPerInning','asc'],['Runs Allowed','runs','asc'],['Strike %','strikePercentage','desc'],['Walks per 9','walksPer9Inn','asc'],['WHIP','whip','asc']]};const M={top:40,right:180,bottom:40,left:60},W=1350-M.left-M.right,H=550-M.top-M.bottom;let colors,data,active=new Set,category='pitching',view='line',svg,x,y;const bisect=d3.bisector(d=>new Date(d.date)).left;
async function init(){try{const l=await d3.json('./data/update_log.json');d3.select('#updated').text(`Last Sync: ${l.last_updated}`)}catch{d3.select('#updated').text('Live Sync Active')}colors=await d3.json('./data/team_colors.json');Object.keys(colors).forEach(id=>active.add(id));filters();svg=d3.select('#chart').append('svg').attr('viewBox',`0 0 ${W+M.left+M.right} ${H+M.top+M.bottom}`).append('g').attr('transform',`translate(${M.left},${M.top})`);x=d3.scaleTime().range([0,W]);y=d3.scaleLinear().range([H,0]);svg.append('g').attr('class','xa').attr('transform',`translate(0,${H})`);svg.append('g').attr('class','ya');changeCategory()}
function filters(){const gs=[['ALL','All MLB'],['AL','AL'],['NL','NL'],['AL-East','AL-East'],['AL-Central','AL-Central'],['AL-West','AL-West'],['NL-East','NL-East'],['NL-Central','NL-Central'],['NL-West','NL-West']];d3.select('#geo').selectAll('button').data(gs).join('button').attr('class',(d,i)=>`btn${i?'':' active'}`).text(d=>d[1]).on('click',function(e,d){applyGeo(d[0],this)});d3.select('#teams').selectAll('button').data(Object.entries(colors).sort((a,b)=>a[1].name.localeCompare(b[1].name))).join('button').attr('class','pill active').attr('data-id',d=>d[0]).text(d=>d[1].name).on('click',function(e,d){active.has(d[0])?active.delete(d[0]):active.add(d[0]);d3.select(this).classed('active',active.has(d[0]));render()})}
async function changeCategory(){category=d3.select('#category').property('value');const stats=[...cfg[category]].sort((a,b)=>a[0].localeCompare(b[0]));d3.select('#stat').selectAll('option').data(stats).join('option').attr('value',d=>d[1]).text(d=>d[0]);data=await d3.json(`./data/${category}_s2d.json`);render()}function chooseNone(){active.clear();d3.selectAll('.pill').classed('active',false);render()}function chooseAll(){Object.keys(colors).forEach(id=>active.add(id));d3.selectAll('.pill').classed('active',true);render()}function applyGeo(g,b){active.clear();d3.selectAll('#geo .btn').classed('active',false);d3.select(b).classed('active',true);Object.entries(colors).forEach(([id,c])=>{if(g==='ALL'||c.league===g||`${c.league}-${c.division}`===g)active.add(id)});d3.selectAll('.pill').classed('active',function(){return active.has(this.dataset.id)});render()}function setView(v){view=v;d3.selectAll('#line,#race').classed('active',false);d3.select(`#${v}`).classed('active',true);render()}
function ranks(rows,stat,dir){const dates=[...new Set(rows.map(d=>d.date))].sort(),out=new Map,latest=new Map;for(const date of dates){rows.filter(d=>d.date===date).forEach(d=>latest.set(String(d.teamId),+d[stat]||0));[...latest].sort((a,b)=>dir==='desc'?d3.descending(a[1],b[1]):d3.ascending(a[1],b[1])).forEach((d,i)=>out.set(`${date}|${d[0]}`,i+1))}return out}
function render(){if(!data)return;const stat=d3.select('#stat').property('value'),info=cfg[category].find(d=>d[1]===stat),rows=data.filter(d=>active.has(String(d.teamId))).sort((a,b)=>d3.ascending(a.date,b.date));svg.selectAll('.line,.avg,.selection,.avg-label,.label').remove();d3.select('#title').text(rows.length?`Season Performance Trends: ${info[0]} — ${category[0].toUpperCase()+category.slice(1)}`:'Season Performance Trends — no teams selected');if(!rows.length)return;x.domain(d3.extent(rows,d=>new Date(d.date)));view==='line'?y.domain(d3.extent(data.filter(d=>new Date(d.date)>=x.domain()[0]&&new Date(d.date)<=x.domain()[1]),d=>+d[stat]||0)).nice():y.domain([active.size,1]);const rm=view==='race'?ranks(rows,stat,info[2]):null,groups=d3.groups(rows,d=>String(d.teamId)),line=d3.line().curve(d3.curveMonotoneX).x(d=>x(new Date(d.date))).y(d=>y(view==='line'?(+d[stat]||0):rm.get(`${d.date}|${d.teamId}`)));svg.selectAll('.line').data(groups).join('path').attr('class','line').attr('stroke',d=>colors[d[0]]?.primary||'#aaa').attr('d',d=>line(d[1])).on('mousemove',function(e,d){d3.selectAll('.line').style('opacity',.05);d3.select(this).classed('hovered',true).raise();const i=bisect(d[1],x.invert(d3.pointer(e,svg.node())[0])),p=d[1][i]||d[1].at(-1),last=d[1].at(-1);d3.select('#tip').style('display','block').style('left',`${e.pageX+20}px`).style('top',`${e.pageY-20}px`).html(`<b>${colors[d[0]]?.name}</b><hr>Date: ${p.date}<br>Value: <b>${p[stat]}</b><br><br>Season Latest: <b>${last[stat]}</b>`) }).on('mouseleave',()=>{d3.selectAll('.line').style('opacity',.3).classed('hovered',false);d3.select('#tip').style('display','none')});if(view==='line'){const makeAvg=source=>d3.groups(source,d=>d.date).map(([date,v])=>({date:new Date(date),val:d3.mean(v,d=>+d[stat]||0)})).filter(d=>d.date>=x.domain()[0]&&d.date<=x.domain()[1]).sort((a,b)=>a.date-b.date),avgLine=d3.line().curve(d3.curveMonotoneX).x(d=>x(d.date)).y(d=>y(d.val)),mlbAvg=makeAvg(data);svg.append('path').datum(mlbAvg).attr('class','avg').attr('d',avgLine);svg.append('text').attr('class','avg-label').attr('fill','#000').attr('x',W+7).attr('y',y(mlbAvg.at(-1).val)+4).text('MLB Avg.');if(active.size<Object.keys(colors).length){const selectionAvg=makeAvg(rows);svg.append('path').datum(selectionAvg).attr('class','selection').attr('d',avgLine);svg.append('text').attr('class','avg-label').attr('fill','#d97706').attr('x',W+7).attr('y',y(selectionAvg.at(-1).val)+4).text('Selection Avg.')}}svg.select('.xa').call(d3.axisBottom(x).ticks(innerWidth<600?4:8));svg.select('.ya').call(d3.axisLeft(y));if(view==='race'){const last=groups.map(g=>g[1].at(-1)).sort((a,b)=>info[2]==='desc'?d3.descending(+a[stat]||0,+b[stat]||0):d3.ascending(+a[stat]||0,+b[stat]||0));svg.selectAll('.label').data(last).join('text').attr('class','label').attr('x',W+5).attr('y',(d,i)=>y(i+1)+4).text((d,i)=>`${i+1}. ${colors[d.teamId]?.name}`)}}init();
</script></body></html>
